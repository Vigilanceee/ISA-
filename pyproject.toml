[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "in-synapse-activation"
version = "0.1.0"
description = "Physical activation and compute-in-memory FFNs for vision and language models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "datasets>=2.18",
  "huggingface-hub>=0.23",
  "matplotlib>=3.7",
  "ninja>=1.11",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "optuna>=3.6",
  "pyarrow>=15",
  "PyYAML>=6",
  "torch>=2.3",
  "torchvision>=0.18",
  "tqdm>=4.66",
  "transformers>=4.40",
  "triton>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
isa = "isa.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
